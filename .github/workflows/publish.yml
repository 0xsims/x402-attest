name: Publish
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm i -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public -w @tempus1/x402-attest
      - run: npm publish --access public -w @tempus1/clawrouter-attest
      - run: npm publish --access public -w @tempus1/x402-verify-cli
